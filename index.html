<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back Soon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0b0b;
      --surface: #111111;
      --gold: #c9a84c;
      --gold-dim: #c9a84c44;
      --text-primary: #f0ece3;
      --text-secondary: #7a776e;
      --border: #1f1f1f;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Noise grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    /* Ambient radial glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse at center, #c9a84c0a 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.12); }
    }

    /* ─── Layout ─── */
    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      max-width: 560px;
      width: 100%;
      animation: fadein 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Ornament ─── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 3rem;
    }

    .ornament-line {
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
    }

    .ornament-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold), 0 0 24px var(--gold-dim);
      animation: pulse 2.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1);    box-shadow: 0 0 8px var(--gold), 0 0 20px var(--gold-dim); }
      50%       { opacity: 0.5; transform: scale(0.7);  box-shadow: 0 0 4px var(--gold), 0 0 8px var(--gold-dim); }
    }

    /* ─── Eyebrow ─── */
    .eyebrow {
      font-size: 0.6875rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 1.25rem;
      opacity: 0.9;
    }

    /* ─── Headline ─── */
    h1 {
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
    }

    h1 em {
      font-style: normal;
      font-weight: 600;
    }

    /* ─── Divider ─── */
    .divider {
      width: 32px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 1.5rem;
      opacity: 0.5;
    }

    /* ─── Body text ─── */
    p {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-secondary);
      font-weight: 400;
      max-width: 380px;
    }

    /* ─── Scanning bar ─── */
    .scan-track {
      width: 100%;
      max-width: 320px;
      height: 1px;
      background: var(--border);
      margin-top: 3rem;
      position: relative;
      overflow: hidden;
      border-radius: 1px;
    }

    .scan-bar {
      position: absolute;
      top: 0;
      left: -30%;
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: scan 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes scan {
      0%   { left: -30%; }
      100% { left: 130%; }
    }

    /* ─── LinkedIn link ─── */
    .linkedin {
      display: inline-flex;
      align-items: center;
      gap: 0.45em;
      margin-top: 2rem;
      font-size: 0.8125rem;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .linkedin:hover {
      color: var(--gold);
      border-bottom-color: var(--gold-dim);
    }

    .linkedin svg {
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .linkedin:hover svg {
      opacity: 1;
    }

    /* ─── Footer note ─── */
    .footer-note {
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-dot"></div>
      <div class="ornament-line"></div>
    </div>

    <p class="eyebrow">Under Redesign</p>

    <h1>Something <em>new</em><br>is on its way.</h1>

    <div class="divider"></div>

    <p>The site is getting a fresh coat of paint. Check back soon — it'll be worth the wait.</p>

    <div class="scan-track">
      <div class="scan-bar"></div>
    </div>

    <a class="linkedin" href="https://www.linkedin.com/in/jonas-davidsen-01a1b0219" target="_blank" rel="noopener noreferrer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
      Jonas Davidsen
    </a>

    <p class="footer-note">© 2026</p>
  </div>
</body>
</html>
